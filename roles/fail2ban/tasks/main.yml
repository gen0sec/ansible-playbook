---
- name: Do nothing unless the Fail2Ban integration is enabled
  ansible.builtin.meta: end_role
  when: not (fail2ban_enabled | bool)

- name: Normalise the optional overrides
  # A null (gen0sec_expiration: with no value) renders as an empty string in a
  # template and as "None" through | string; both become '' here.
  ansible.builtin.set_fact:
    fail2ban_expiration_value: "{{ '' if gen0sec_expiration is none else (gen0sec_expiration | string | trim) }}"
    fail2ban_host_value: "{{ '' if fail2ban_host is none else (fail2ban_host | string | trim) }}"

- name: Require a non-negative whole number of seconds for gen0sec_expiration
  ansible.builtin.fail:
    msg: >-
      gen0sec_expiration must be a non-negative whole number of seconds without
      leading zeros, or unset to use the jail's bantime.
  when:
    - fail2ban_expiration_value | length > 0
    - fail2ban_expiration_value is not match('^(0|[1-9][0-9]*)$')

- name: Require the Gen0Sec API key
  ansible.builtin.fail:
    msg: >-
      fail2ban_enabled is true but gen0sec_api_key is empty. Set gen0sec_api_key
      (or the legacy g0s_api_key) for the Fail2Ban integration, or set
      fail2ban_enabled to false.
  when: gen0sec_api_key | default('') | length == 0

- name: Install fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present
  when:
    - fail2ban_manage_service | bool
    - ansible_facts["os_family"] in ['Debian', 'RedHat']

- name: Install curl and jq
  ansible.builtin.package:
    name:
      - curl
      - jq
    state: present
  when: fail2ban_manage_service | bool

- name: Install the Gen0Sec action file
  ansible.builtin.copy:
    src: gen0sec.conf
    dest: "{{ fail2ban_config_dir }}/action.d/gen0sec.conf"
    owner: "{{ fail2ban_file_owner }}"
    group: "{{ fail2ban_file_group }}"
    mode: '0640'
  notify: Restart fail2ban

- name: Write the Gen0Sec API key header file
  ansible.builtin.copy:
    content: "Authorization: Bearer {{ gen0sec_api_key }}\n"
    dest: "{{ fail2ban_config_dir }}/gen0sec.headers"
    owner: "{{ fail2ban_file_owner }}"
    group: "{{ fail2ban_file_group }}"
    mode: '0600'
  no_log: true
  diff: false
  when: gen0sec_api_key | default('') | length > 0
  notify: Restart fail2ban

- name: Write the Gen0Sec action overrides
  ansible.builtin.copy:
    content: |
      [Init]
      {% if fail2ban_expiration_value | length > 0 %}
      expiration = {{ fail2ban_expiration_value }}
      {% endif %}
      {% if fail2ban_host_value | length > 0 %}
      g0shost = {{ fail2ban_host_value }}
      {% endif %}
    dest: "{{ fail2ban_config_dir }}/action.d/gen0sec.local"
    owner: "{{ fail2ban_file_owner }}"
    group: "{{ fail2ban_file_group }}"
    mode: '0644'
  when: (fail2ban_expiration_value | length > 0) or (fail2ban_host_value | length > 0)
  notify: Restart fail2ban

- name: Remove the Gen0Sec action overrides when none is set
  ansible.builtin.file:
    path: "{{ fail2ban_config_dir }}/action.d/gen0sec.local"
    state: absent
  when:
    - fail2ban_expiration_value | length == 0
    - fail2ban_host_value | length == 0
  notify: Restart fail2ban

- name: Configure DEFAULT section in jail.local
  ansible.builtin.blockinfile:
    path: "{{ fail2ban_config_dir }}/jail.local"
    block: |
      [DEFAULT]
      banaction = gen0sec
      banaction_allports = gen0sec
      backend = {{ fail2ban_backend }}
    marker: "# {mark} ANSIBLE MANAGED BLOCK - DEFAULT"
    create: true
    owner: "{{ fail2ban_file_owner }}"
    group: "{{ fail2ban_file_group }}"
    mode: '0644'
  notify: Restart fail2ban

- name: Configure sshd jail
  ansible.builtin.blockinfile:
    path: "{{ fail2ban_config_dir }}/jail.local"
    block: |
      [sshd]
      enabled = {{ 'true' if fail2ban_jail_enabled else 'false' }}
    marker: "# {mark} ANSIBLE MANAGED BLOCK - SSHD"
    create: true
    owner: "{{ fail2ban_file_owner }}"
    group: "{{ fail2ban_file_group }}"
    mode: '0644'
  notify: Restart fail2ban

- name: Ensure fail2ban service is enabled and started
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
    daemon_reload: true
  when: fail2ban_manage_service | bool
