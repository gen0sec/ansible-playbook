---
# Default variables for synapse role

# Gen0Sec Repository Access credential (dashboard: Clients -> Repository
# Access). Read from the control machine's environment so it never has to be
# written to a file or a command line; or set it in an Ansible Vault file.
gen0sec_repo_key: "{{ lookup('env', 'GEN0SEC_REPO_KEY') }}"  # noqa: var-naming[no-role-prefix]

# Install the build with the bundled ML models (synapse-agent-ml, synapse-proxy-ml)
synapse_ml: false
# "" installs what the repository serves; a version such as "0.9.0" or
# "0.9.0~rc.1" pins it (package release -1)
synapse_version: ""
synapse_package_state: present  # present, or latest to upgrade on every run
synapse_service_state: started  # started or stopped; the unit is always enabled

# Package repositories and their signing key
synapse_apt_url: https://apt.gen0sec.com
synapse_apt_suite: stable
synapse_apt_component: main
synapse_apt_keyring: /usr/share/keyrings/gen0sec.gpg
synapse_apt_lists_dir: /var/lib/apt/lists
synapse_rpm_url: https://rpm.gen0sec.com/
synapse_yum_reposdir: /etc/yum.repos.d
synapse_keyserver_url: https://keyserver.ubuntu.com
synapse_repo_key_fingerprint: C1631499081A7146332D2038798FF49A6E9DA146
synapse_key_url: "{{ synapse_keyserver_url }}/pks/lookup?op=get&search=0x{{ synapse_repo_key_fingerprint }}"
synapse_rpm_key_file: /etc/pki/rpm-gpg/RPM-GPG-KEY-gen0sec

gen0sec_api_key: "{{ g0s_api_key | default('') }}"  # Gen0Sec API key (used for synapse config); g0s_api_key is the legacy alias  # noqa: var-naming[no-role-prefix]
clamav_enabled: true  # Set to false to disable ClamAV installation  # noqa: var-naming[no-role-prefix]
redis_enabled: true   # Set to false to disable Redis installation  # noqa: var-naming[no-role-prefix]

# Synapse Configuration Options
# These variables map to config.yaml settings
# All variables use the prefix synapse_config_* and map to the corresponding config.yaml path
# Example: synapse_config_mode maps to mode, synapse_config_network_iface maps to network.iface
# If a variable is not set, the template will use defaults from the original config.yaml

# Application mode: "agent" or "proxy"
# synapse_config_mode: "agent"  # Default is "agent"

# Network configuration
# synapse_config_network_iface: "eth0"
# synapse_config_network_ifaces: []  # List of interfaces, e.g. ["eth0", "eth1"]
# synapse_config_network_ip_version: "both"  # "ipv4", "ipv6", or "both"

# Redis configuration (written to proxy.redis; proxy mode only)
# synapse_config_redis_url: "redis://127.0.0.1/0"  # default "" when redis_enabled is false
# synapse_config_redis_prefix: "g0s:synapse"
# synapse_config_redis_ssl_ca_cert_path: null
# synapse_config_redis_ssl_client_cert_path: null
# synapse_config_redis_ssl_client_key_path: null
# synapse_config_redis_ssl_insecure: false

# Gen0Sec platform configuration (written to platform.*)
# synapse_config_platform_api_key: ""  # Will be set from gen0sec_api_key if not specified
# synapse_config_platform_base_url: "https://api.gen0sec.com/v1"
# synapse_config_platform_telemetry_sending_enabled: true
# synapse_config_platform_include_response_body: true
# synapse_config_platform_max_body_size: 1048576

# Content scanning
# synapse_config_content_scanning_enabled: false
# synapse_config_content_scanning_clamav_server: "localhost:3310"

# GeoIP (written to platform.geoip; proxy mode only). Defaults follow the
# shipped config/config.yaml: the combined IPinfo Lite database serves country
# and ASN, so asn and city are empty (unused).
# synapse_config_geoip_country_url: "https://github.com/gen0sec/geoip-databases/raw/download/ipinfo_lite.mmdb"
# synapse_config_geoip_country_path: "/var/lib/synapse/ipinfo_lite.mmdb"
# synapse_config_geoip_asn_url: ""
# synapse_config_geoip_city_url: ""

# Logging
# synapse_config_logging_level: "info"  # error, warn, info, debug, trace
# synapse_config_logging_fingerprint_log_enabled: true
# synapse_config_logging_fingerprint_log_file: "/var/log/synapse/fingerprints.log"

# ACME configuration
# synapse_config_acme_enabled: true
# synapse_config_acme_email: null
# synapse_config_acme_storage_path: "/var/lib/synapse/acme"
# synapse_config_acme_development: false

# For a complete list of available config options, see the config.yaml template
# or the original config.yaml file in config/config.yaml
