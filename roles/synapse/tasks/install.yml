---
# One of four packages, chosen in select.yml. They conflict, so the other
# three go first. The deb postinst starts the unit; the rpm %post only
# reloads systemd, so the service is handled explicitly in main.yml.
# The package removal does not reliably stop the unit: its maintainer script
# can be refused by a policy-rc.d that denies service actions, as in container
# images, or the host may not be booted with systemd at that moment. So the
# other variants' units are stopped first.
- name: Stop the other synapse variants before removing them
  ansible.builtin.include_tasks: stop_other_variants.yml

- name: Remove the other synapse package variants
  ansible.builtin.package:
    name: "{{ synapse_conflicting_packages }}"
    state: absent

# So systemd forgets the units of the variants that were running.
- name: Reload systemd after replacing a running variant
  ansible.builtin.systemd:
    daemon_reload: true
  when: synapse_other_variant_stop.results | default([]) | map(attribute='changed', default=false) | select | list | length > 0

# The deb postinst starts the unit as soon as the package is configured. On a
# first install that start would run on the package's own default config,
# which auto-selects every uplink (management port and VM interfaces
# included) until the role has written and checked config.yaml. So a first
# install runs under a temporary policy-rc.d that denies starting synapse
# units only; the role starts the service itself once the config is in place
# ("Enable the synapse service and set its state" in main.yml). An existing
# policy-rc.d (container images) is left alone: it already decides.
- name: Check whether synapse is installed (apt)
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Status}', "{{ synapse_package }}"]
  register: synapse_dpkg_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: synapse_pkg_family == 'deb'

- name: Check for an existing policy-rc.d
  ansible.builtin.stat:
    path: /usr/sbin/policy-rc.d
  register: synapse_policy_rc
  when: synapse_pkg_family == 'deb'

- name: Install synapse (apt)
  when: synapse_pkg_family == 'deb'
  vars:
    synapse_hold_start: >-
      {{ 'install ok installed' not in (synapse_dpkg_status.stdout | default(''))
         and not synapse_policy_rc.stat.exists }}
  block:
    - name: Hold back the postinst start until the config is written
      ansible.builtin.copy:
        dest: /usr/sbin/policy-rc.d
        mode: '0755'
        content: |
          #!/bin/sh
          # Temporary, written by the Gen0Sec synapse Ansible role for the
          # first install: deny starting synapse units, allow everything else.
          case "$1" in synapse*) exit 101 ;; esac
          exit 0
      when: synapse_hold_start | bool

    - name: Install the synapse package (apt)
      ansible.builtin.apt:
        name: "{{ synapse_package_spec }}"
        state: "{{ synapse_package_state }}"
        allow_downgrade: "{{ (synapse_version | string) != '' }}"
        update_cache: true
        cache_valid_time: 3600

  always:
    - name: Remove the temporary policy-rc.d
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when: synapse_hold_start | bool

- name: Install synapse (dnf)
  ansible.builtin.dnf:
    name: "{{ synapse_package_spec }}"
    state: "{{ synapse_package_state }}"
    allow_downgrade: "{{ (synapse_version | string) != '' }}"
  when: synapse_pkg_family == 'rpm'
