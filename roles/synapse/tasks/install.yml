---
# One of four packages, chosen in select.yml. They conflict, so the other
# three go first. The deb postinst starts the unit; the rpm %post only
# reloads systemd, so the service is handled explicitly in main.yml.
# The package removal does not reliably stop the unit: its maintainer script
# can be refused by a policy-rc.d that denies service actions, as in container
# images, or the host may not be booted with systemd at that moment. So the
# other variants' units are stopped first.
- name: Stop the other synapse variants before removing them
  ansible.builtin.include_tasks: stop_other_variants.yml

- name: Remove the other synapse package variants
  ansible.builtin.package:
    name: "{{ synapse_conflicting_packages }}"
    state: absent

# So systemd forgets the units of the variants that were running.
- name: Reload systemd after replacing a running variant
  ansible.builtin.systemd:
    daemon_reload: true
  when: synapse_other_variant_stop.results | default([]) | map(attribute='changed', default=false) | select | list | length > 0

- name: Install synapse (apt)
  ansible.builtin.apt:
    name: "{{ synapse_package_spec }}"
    state: "{{ synapse_package_state }}"
    allow_downgrade: "{{ (synapse_version | string) != '' }}"
    update_cache: true
    cache_valid_time: 3600
  when: synapse_pkg_family == 'deb'

- name: Install synapse (dnf)
  ansible.builtin.dnf:
    name: "{{ synapse_package_spec }}"
    state: "{{ synapse_package_state }}"
    allow_downgrade: "{{ (synapse_version | string) != '' }}"
  when: synapse_pkg_family == 'rpm'
