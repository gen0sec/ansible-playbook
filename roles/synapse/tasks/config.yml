---
- name: Detect primary network interface if not explicitly set
  ansible.builtin.set_fact:
    synapse_config_network_iface: "{{ ansible_facts['default_ipv4']['interface'] | default('eth0') }}"
  when: synapse_config_network_iface is not defined

- name: Set platform API key from gen0sec_api_key if not explicitly set
  ansible.builtin.set_fact:
    synapse_config_platform_api_key: "{{ gen0sec_api_key }}"
  when:
    - gen0sec_api_key != ""
    - synapse_config_platform_api_key is not defined
  no_log: true
  tags: gen0sec_secrets

# --check-config is not in every released binary. Ask the installed binary
# rather than assume, and say so when it cannot validate.
- name: Ask the installed binary whether it has --check-config
  ansible.builtin.command:
    argv: [/usr/bin/synapse, --help]
  register: synapse_help
  changed_when: false
  failed_when: false
  check_mode: false

- name: Note whether --check-config is available
  ansible.builtin.set_fact:
    synapse_has_check_config: "{{ synapse_help.rc == 0 and '--check-config' in (synapse_help.stdout ~ synapse_help.stderr) }}"

- name: Say that the config was not validated
  ansible.builtin.debug:
    msg: >-
      NOTICE: /usr/bin/synapse does not list --check-config, so
      /etc/synapse/config.yaml was NOT validated before the service restart.
  when: not (synapse_has_check_config | bool)

# The template module checks the new file with --check-config before it
# replaces /etc/synapse/config.yaml, so an invalid config never reaches disk
# and the running service keeps the last good one. %s is the temporary file.
# validate is left out when the binary has no --check-config.
#
# The config can hold the API key: no diff, no backup copy, no task output.
# The checker's own output is withheld with it, so the rescue says where to
# read it.
- name: Write config.yaml, checked first when the binary can
  block:
    - name: Generate config.yaml from template
      ansible.builtin.template:
        src: config.yaml.j2
        dest: /etc/synapse/config.yaml
        owner: root
        group: root
        mode: '0640'
        validate: "{{ '/usr/bin/synapse --check-config -c %s' if synapse_has_check_config | bool else omit }}"
      no_log: true
      diff: false
      notify: Restart synapse service
      tags: gen0sec_secrets
  rescue:
    - name: Refuse a config.yaml that cannot be written or does not validate
      ansible.builtin.fail:
        msg: >-
          /etc/synapse/config.yaml was not replaced and the service was not
          restarted: the template could not be written or
          "/usr/bin/synapse --check-config" rejected it. The output is
          withheld because it may contain the API key. Render the same
          settings to a file and run "/usr/bin/synapse --check-config -c FILE"
          on the host to read the reason.
