---
# Example group variables for all hosts
# Copy this file to group_vars/all.yml and set your actual values

# Gen0Sec Repository Access credential: set the GEN0SEC_REPO_KEY environment
# variable on the control machine (preferred), or put gen0sec_repo_key in an
# Ansible Vault file. Never pass it with -e, which lands in shell history.

# Synapse version to install. Empty installs what the repository serves; pin
# with "0.9.0" or "0.9.0~rc.1".
# synapse_version: ""

# Install the build with the bundled ML models (synapse-agent-ml, synapse-proxy-ml)
# synapse_ml: false

# Gen0Sec API key, used by both synapse and fail2ban. Optional: without it
# Synapse runs standalone. Uncomment and set it, or pass -e gen0sec_api_key=...
# gen0sec_api_key: "your_api_key_here"

# Optional services
clamav_enabled: true  # Set to false to disable ClamAV installation
redis_enabled: true   # Set to false to disable Redis installation

# Fail2Ban integration (optional)
fail2ban_enabled: false  # Set to true to enable Fail2Ban integration
# gen0sec_expiration: 600  # Block expiration in seconds, 60 to 315360000; unset uses the jail's bantime
fail2ban_jail_enabled: true
fail2ban_backend: systemd  # Use 'auto' for automatic detection

# Synapse Configuration Options
# All config options use the prefix synapse_config_* and map to config.yaml settings
# Uncomment and modify as needed. See roles/synapse/defaults/main.yml for all available options.

# Network configuration
# synapse_config_network_iface: "eth0"
# synapse_config_network_ip_version: "both"  # "ipv4", "ipv6", or "both"

# Redis configuration
# synapse_config_redis_url: "redis://127.0.0.1/0"
# synapse_config_redis_prefix: "g0s:synapse"

# Gen0Sec platform configuration
# synapse_config_platform_base_url: "https://api.gen0sec.com/v1"
# synapse_config_platform_telemetry_sending_enabled: true
# synapse_config_platform_include_response_body: true

# Content scanning
# synapse_config_content_scanning_enabled: false
# synapse_config_content_scanning_clamav_server: "localhost:3310"

# GeoIP (proxy mode): combined IPinfo Lite database; asn and city are unused
# synapse_config_geoip_country_url: "https://github.com/gen0sec/geoip-databases/raw/download/ipinfo_lite.mmdb"
# synapse_config_geoip_country_path: "/var/lib/synapse/ipinfo_lite.mmdb"
# synapse_config_geoip_asn_url: ""
# synapse_config_geoip_city_url: ""

# Logging
# synapse_config_logging_level: "info"  # error, warn, info, debug, trace

# ACME configuration
# synapse_config_acme_enabled: true
# synapse_config_acme_email: "admin@example.com"
# synapse_config_acme_storage_path: "/var/lib/synapse/acme"
# synapse_config_acme_development: false

# For a complete list of available config options, see:
# - roles/synapse/defaults/main.yml
# - roles/synapse/templates/config.yaml.j2
# - config/config.yaml (the shipped config file)
